<!DOCTYPE html>
<html>

<head>

    <title>Dear Diary</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <h1>🌸 Dear Diary</h1>

    <p>My little place to write.</p>


    <div id="journal">

        <h2>Today's Page</h2>

        <input id="title" type="text" placeholder="Page title">

        <br><br>

        <textarea id="entry" placeholder="Write your journal here..."></textarea>

        <br>

        <button onclick="savePage()">SAVE PAGE</button>

    </div>


    <h2>📖 My Pages</h2>

    <div id="pages"></div>


    <script src="script.js"></script>

</body>

</html>
